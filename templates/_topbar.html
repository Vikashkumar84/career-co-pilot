<div class="cc-topbar">
  <div class="d-flex align-items-center gap-3">
    <button class="hamburger-btn" id="hamburgerBtn" aria-label="Open menu">
      <i class="fa-solid fa-bars"></i>
    </button>
    <div class="cc-search d-none d-md-flex">
      <i class="fa-solid fa-magnifying-glass text-muted-soft"></i>
      <input type="text" placeholder="Search courses, skills, roles…" aria-label="Search">
    </div>
  </div>
  <div class="d-flex align-items-center gap-3">
    <button class="cc-topbar-icon" aria-label="Notifications" title="Notifications">
      <i class="fa-regular fa-bell"></i>
    </button>
    <div class="d-flex align-items-center gap-2">
      <div class="cc-avatar">{{ current_user_initials }}</div>
      <div class="d-none d-md-block">
        <div class="fw-semibold" style="font-size:0.92rem;">{{ current_user_name }}</div>
        <div class="text-muted-soft" style="font-size:0.78rem;">Career Copilot</div>
      </div>
    </div>
  </div>
</div>
