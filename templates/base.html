<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Career Copilot – AI-Powered Career Guidance{% endblock %}</title>

<!-- System fonts avoid third-party font requests -->
<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<!-- App styles -->
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='responsive.css') }}">
{% block extra_css %}{% endblock %}
</head>
<body>
<a class="skip-link" href="#main-content">Skip to main content</a>
<div id="main-content" tabindex="-1">

{% block body %}{% endblock %}
</div>
{% include "_legal_footer.html" %}
{% include "_cookie_banner.html" %}

<!-- Bootstrap Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
<script src="{{ url_for('static', filename='js/privacy.js') }}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
